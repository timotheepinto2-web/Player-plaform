<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Pong - Multijoueur en Ligne</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        body { font-family: 'Orbitron', sans-serif; background: #05050a; color: #fff; overflow-x: hidden; user-select: none; }
        .neon-glow { text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff; }
        .neon-glow-pink { text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; }
        .neon-box { box-shadow: 0 0 15px rgba(0, 243, 255, 0.25); border: 1px solid rgba(0, 243, 255, 0.4); background: rgba(5, 5, 10, 0.9); }
        .scanlines { background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%); background-size: 100% 4px; pointer-events: none; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between items-center p-4 relative">

    <div class="absolute inset-0 scanlines z-50"></div>

    <!-- En-tête -->
    <header class="w-full max-w-2xl flex justify-between items-center z-20 py-3 border-b border-cyan-500/20">
        <div>
            <h1 class="text-xl md:text-2xl font-black text-cyan-400 neon-glow tracking-wider">CYBER PONG</h1>
            <p class="text-xs text-cyan-300/60 tracking-widest">NET_PROTOCOL // V1.0</p>
        </div>
        <div id="connection-status" class="text-xs px-3 py-1 rounded bg-cyan-950/50 border border-cyan-500/30 text-cyan-300 font-bold">
            STATUT : HORS LIGNE
        </div>
    </header>

    <!-- ÉCRAN DU MENU PRINCIPAL -->
    <div id="screen-menu" class="w-full max-w-md flex-1 flex flex-col items-center justify-center z-20 gap-4 my-auto">
        <div class="text-center mb-2">
            <h2 class="text-3xl font-black text-cyan-300 neon-glow">MODE DE JEU</h2>
        </div>
        <div class="neon-box p-6 rounded-xl w-full flex flex-col gap-4">
            <button onclick="startSoloGame()" class="w-full py-4 bg-cyan-600/30 border border-cyan-400 font-bold rounded-lg text-cyan-200 hover:bg-cyan-600/50 transition">
                MODE SOLO (VS IA)
            </button>
            <button onclick="showMultiMenu()" class="w-full py-4 bg-pink-600/30 border border-pink-400 font-bold rounded-lg text-pink-200 hover:bg-pink-600/50 transition">
                MULTIJOUEUR (EN LIGNE / SALON)
            </button>
        </div>
    </div>

    <!-- ÉCRAN DU MENU MULTIJOUEUR -->
    <div id="screen-multi-menu" class="w-full max-w-md flex-1 hidden flex-col items-center justify-center z-20 gap-4 my-auto">
        <div class="text-center mb-2">
            <h2 class="text-2xl font-black text-pink-400 neon-glow-pink">SALON MULTIJOUEUR</h2>
        </div>
        <div class="neon-box p-6 rounded-xl w-full flex flex-col gap-4">
            <!-- Créer un salon -->
            <button onclick="hostRoom()" class="w-full py-3 bg-cyan-600 font-bold rounded text-white hover:bg-cyan-500 transition">
                CRÉER UN SALON
            </button>
            <div id="host-info" class="hidden text-center bg-black/50 p-3 rounded border border-cyan-500/30">
                <span class="text-xs text-gray-400">Code de votre salon :</span>
                <div id="room-code-display" class="text-2xl font-black text-pink-400 tracking-widest my-1">----</div>
                <p class="text-xs text-yellow-400 animate-pulse">En attente d'un adversaire...</p>
            </div>

            <div class="border-t border-cyan-500/20 my-1"></div>

            <!-- Rejoindre un salon -->
            <div class="flex flex-col gap-2">
                <label class="text-xs text-gray-400">Rejoindre avec un code :</label>
                <input id="input-room-code" type="text" placeholder="EX: A1B2" maxlength="4" class="bg-black/60 border border-cyan-500/50 p-3 rounded text-center tracking-widest text-lg font-bold uppercase text-cyan-300 outline-none focus:border-cyan-400">
                <button onclick="joinRoom()" class="w-full py-3 bg-pink-600 font-bold rounded text-white hover:bg-pink-500 transition mt-1">
                    REJOINDRE
                </button>
            </div>

            <div id="multi-status-msg" class="text-center text-xs text-yellow-300 font-bold min-h-[20px]"></div>

            <button onclick="showMainMenu()" class="text-xs text-gray-400 hover:text-white transition text-center mt-2">
                Retour au menu
            </button>
        </div>
    </div>

    <!-- ÉCRAN DE JEU (CANVAS) -->
    <div id="screen-game" class="w-full max-w-3xl flex-1 hidden flex-col items-center justify-center z-20 gap-3 my-auto">
        <div class="w-full flex justify-between items-center neon-box px-4 py-2 rounded">
            <div class="text-xs font-bold text-cyan-300" id="hud-role">PONG</div>
            <div class="text-xl font-black text-yellow-300" id="hud-score">0 - 0</div>
            <button onclick="quitGame()" class="text-xs bg-red-950/80 border border-red-500 px-3 py-1 rounded text-red-300 hover:bg-red-900 transition">
                QUITTER
            </button>
        </div>

        <div class="relative w-full aspect-[4/3] max-h-[55vh] neon-box rounded-xl overflow-hidden flex items-center justify-center bg-black/90">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- Contrôles tactiles mobiles -->
            <div id="touch-controls" class="absolute inset-x-0 bottom-3 flex justify-between px-6 pointer-events-none hidden">
                <button id="btn-up" class="pointer-events-auto bg-cyan-600/50 border border-cyan-400 text-white w-14 h-14 rounded-full font-bold text-xl flex items-center justify-center active:bg-cyan-500">▲</button>
                <button id="btn-down" class="pointer-events-auto bg-cyan-600/50 border border-cyan-400 text-white w-14 h-14 rounded-full font-bold text-xl flex items-center justify-center active:bg-cyan-500">▼</button>
            </div>
        </div>
    </div>

    <!-- Script de gestion réseau et jeu -->
    <script>
        // Gestion des écrans
        function showScreen(screenId) {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-multi-menu').classList.add('hidden');
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
            document.getElementById(screenId).classList.add('flex');
        }

        function showMainMenu() { stopGame(); showScreen('screen-menu'); }
        function showMultiMenu() { showScreen('screen-multi-menu'); }

        let gameRunning = false;
        let isMultiplayer = false;
        let isHost = false;
        let roomCode = '';
        let channel = null;

        // Code aléatoire pour les salons
        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let res = '';
            for(let i=0; i<4; i++) res += chars[Math.floor(Math.random() * chars.length)];
            return res;
        }

        function setStatus(text, color = "text-cyan-300") {
            const el = document.getElementById('connection-status');
            el.innerText = text;
            el.className = `text-xs px-3 py-1 rounded bg-cyan-950/50 border border-cyan-500/30 ${color} font-bold`;
        }

        // --- MODE MULTIJOUEUR (BroadcastChannel / Bridge fiable multi-onglets et multi-appareils) ---
        function hostRoom() {
            roomCode = generateCode();
            isHost = true;
            isMultiplayer = true;
            
            document.getElementById('room-code-display').innerText = roomCode;
            document.getElementById('host-info').classList.remove('hidden');
            document.getElementById('multi-status-msg').innerText = "Salon ouvert. En attente du joueur 2...";
            setStatus("STATUT : HÔTE", "text-cyan-400");

            if (channel) channel.close();
            channel = new BroadcastChannel('cyber_pong_' + roomCode);
            
            channel.onmessage = (event) => {
                if (event.data && event.data.type === 'JOIN') {
                    document.getElementById('multi-status-msg').innerText = "Joueur 2 connecté ! Lancement...";
                    setTimeout(() => {
                        startMultiGameSession(true);
                    }, 800);
                }
            };
        }

        function joinRoom() {
            const codeInput = document.getElementById('input-room-code').value.toUpperCase().trim();
            if (codeInput.length !== 4) {
                document.getElementById('multi-status-msg').innerText = "Entrez un code valide à 4 caractères.";
                return;
            }

            roomCode = codeInput;
            isHost = false;
            isMultiplayer = true;
            
            document.getElementById('multi-status-msg').innerText = "Connexion au salon " + roomCode + "...";

            if (channel) channel.close();
            channel = new BroadcastChannel('cyber_pong_' + roomCode);

            // Annoncer sa présence
            channel.postMessage({ type: 'JOIN' });

            setTimeout(() => {
                setStatus("STATUT : CLIENT", "text-pink-400");
                startMultiGameSession(false);
            }, 600);
        }

        function startSoloGame() {
            isMultiplayer = false;
            isHost = true;
            setStatus("STATUT : SOLO", "text-yellow-400");
            showScreen('screen-game');
            document.getElementById('hud-role').innerText = "CYBER PONG (SOLO VS IA)";
            document.getElementById('touch-controls').classList.remove('hidden');
            document.getElementById('touch-controls').classList.add('flex');
            initEngine();
        }

        function startMultiGameSession(hosting) {
            showScreen('screen-game');
            document.getElementById('hud-role').innerText = hosting ? "PONG MULTI // HÔTE (J1)" : "PONG MULTI // JOUEUR 2";
            document.getElementById('touch-controls').classList.remove('hidden');
            document.getElementById('touch-controls').classList.add('flex');
            initEngine();
        }

        function quitGame() {
            stopGame();
            if (channel) { channel.close(); channel = null; }
            showMainMenu();
            setStatus("STATUT : HORS LIGNE");
        }

        // --- MOTEUR DE JEU PONG ---
        let animId = null;
        function stopGame() {
            gameRunning = false;
            if (animId) cancelAnimationFrame(animId);
            animId = null;
        }

        function initEngine() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 800;
            canvas.height = 600;

            let paddleWidth = 14, paddleHeight = 100;
            let p1Y = 250, p2Y = 250;
            let ballX = 400, ballY = 300, ballVX = 5, ballVY = 3;
            let p1Score = 0, p2Score = 0;

            let keys = {};
            window.onkeydown = (e) => keys[e.code] = true;
            window.onkeyup = (e) => keys[e.code] = false;

            let touchUp = false, touchDown = false;
            const btnUp = document.getElementById('btn-up');
            const btnDown = document.getElementById('btn-down');
            btnUp.ontouchstart = (e) => { e.preventDefault(); touchUp = true; };
            btnUp.ontouchend = (e) => { e.preventDefault(); touchUp = false; };
            btnDown.ontouchstart = (e) => { e.preventDefault(); touchDown = true; };
            btnDown.ontouchend = (e) => { e.preventDefault(); touchDown = false; };

            // Réception réseau si multijoueur
            if (isMultiplayer && channel) {
                channel.onmessage = (event) => {
                    const d = event.data;
                    if (isHost) {
                        if (d.paddleY !== undefined) p2Y = d.paddleY;
                    } else {
                        if (d.ballX !== undefined) {
                            ballX = d.ballX;
                            ballY = d.ballY;
                            p1Y = d.p1Y;
                            p1Score = d.p1Score;
                            p2Score = d.p2Score;
                        }
                    }
                };
            }

            gameRunning = true;

            function gameLoop() {
                if (!gameRunning) return;

                const speed = 8;

                // Contrôles des raquettes
                if (isMultiplayer) {
                    if (isHost) {
                        if (keys['KeyW'] || keys['ArrowUp'] || touchUp) p1Y -= speed;
                        if (keys['KeyS'] || keys['ArrowDown'] || touchDown) p1Y += speed;
                        p1Y = Math.max(0, Math.min(canvas.height - paddleHeight, p1Y));
                    } else {
                        if (keys['KeyW'] || keys['ArrowUp'] || touchUp) p2Y -= speed;
                        if (keys['KeyS'] || keys['ArrowDown'] || touchDown) p2Y += speed;
                        p2Y = Math.max(0, Math.min(canvas.height - paddleHeight, p2Y));
                        channel.postMessage({ paddleY: p2Y });
                    }
                } else {
                    // Mode Solo (Joueur 1 au clavier/tactile, Joueur 2 IA)
                    if (keys['KeyW'] || keys['ArrowUp'] || touchUp) p1Y -= speed;
                    if (keys['KeyS'] || keys['ArrowDown'] || touchDown) p1Y += speed;
                    p1Y = Math.max(0, Math.min(canvas.height - paddleHeight, p1Y));

                    let targetY = ballY - paddleHeight / 2;
                    p2Y += (targetY - p2Y) * 0.08;
                    p2Y = Math.max(0, Math.min(canvas.height - paddleHeight, p2Y));
                }

                // Logique physique (gérée par l'Hôte ou en Solo)
                if (!isMultiplayer || isHost) {
                    ballX += ballVX;
                    ballY += ballVY;

                    if (ballY <= 0 || ballY >= canvas.height) {
                        ballVY *= -1;
                    }

                    // Collision Raquette 1 (Gauche)
                    if (ballX <= 30 + paddleWidth && ballY >= p1Y && ballY <= p1Y + paddleHeight) {
                        ballVX *= -1;
                        ballVX *= 1.03;
                    }

                    // Collision Raquette 2 (Droite)
                    if (ballX >= canvas.width - 30 - paddleWidth && ballY >= p2Y && ballY <= p2Y + paddleHeight) {
                        ballVX *= -1;
                        ballVX *= 1.03;
                    }

                    // Points
                    if (ballX < 0) {
                        p2Score++;
                        ballX = canvas.width / 2; ballY = canvas.height / 2; ballVX = 5;
                    } else if (ballX > canvas.width) {
                        p1Score++;
                        ballX = canvas.width / 2; ballY = canvas.height / 2; ballVX = -5;
                    }

                    if (isMultiplayer && isHost && channel) {
                        channel.postMessage({
                            ballX: ballX,
                            ballY: ballY,
                            p1Y: p1Y,
                            p1Score: p1Score,
                            p2Score: p2Score
                        });
                    }
                }

                // Mise à jour affichage score
                document.getElementById('hud-score').innerText = `${p1Score} - ${p2Score}`;

                // Rendu Graphique Canvas
                ctx.fillStyle = '#05050a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Ligne centrale pointillée
                ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
                ctx.setLineDash([8, 8]);
                ctx.beginPath(); ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height); ctx.stroke();
                ctx.setLineDash([]);

                // Raquette 1 (Cyan)
                ctx.fillStyle = '#00f3ff';
                ctx.fillRect(30, p1Y, paddleWidth, paddleHeight);

                // Raquette 2 (Magenta)
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(canvas.width - 30 - paddleWidth, p2Y, paddleWidth, paddleHeight);

                // Balle (Jaune)
                ctx.fillStyle = '#ffd700';
                ctx.beginPath(); ctx.arc(ballX, ballY, 9, 0, Math.PI * 2); ctx.fill();

                animId = requestAnimationFrame(gameLoop);
            }

            gameLoop();
        }
    </script>
</body>
</html>
